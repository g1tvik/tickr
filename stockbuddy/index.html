<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2A4580" />
    <style>
      html, body, #root { background-color: #F4F1E9; min-height: 100vh; }
    </style>

    <title>Tickr — Learn, Simulate & Trade Smarter</title>
    <meta name="description" content="Tickr helps you learn the markets, paper-trade with real market data, and level up with an AI coach. Start with $10,000 in virtual money — zero risk." />
    <link rel="canonical" href="https://tickr.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / social. 1200x630 PNG for universal scraper compatibility
         (X/Twitter, Facebook, LinkedIn, iMessage). Absolute URL is required —
         scrapers don't resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tickr" />
    <meta property="og:title" content="Tickr — Investing, explained." />
    <meta property="og:description" content="Learn the markets, paper-trade with confidence, and level up with an AI coach." />
    <meta property="og:url" content="https://tickr.app/" />
    <meta property="og:image" content="https://tickr.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tickr — Investing, explained." />
    <meta name="twitter:description" content="Learn the markets, paper-trade with confidence, and level up with an AI coach." />
    <meta name="twitter:image" content="https://tickr.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
